[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hooring"
dynamic = ["version"]
description = "Play furin (Japanese wind chime) sounds driven by a wandering breeze."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["furin", "wind-chime", "audio", "synthesis"]
authors = [
  { name = "Toshihiro Kamiya", email = "kamiya@mbj.nifty.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  "numpy>=1.24",
]

[project.scripts]
hooring = "hooring.cli:main"

[project.urls]
Homepage = "https://github.com/tos-kamiya/hooring"
Documentation = "https://github.com/tos-kamiya/hooring#readme"
Issues = "https://github.com/tos-kamiya/hooring/issues"
Source = "https://github.com/tos-kamiya/hooring"

[tool.hatch.version]
path = "src/hooring/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/README_ja-JP.md",
  "/release-notes.md",
  "/LICENSE.txt",
  "/pyproject.toml",
  "/uv.lock",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["hooring", "tests"]
branch = true
parallel = true
omit = [
  "src/hooring/__about__.py",
]

[tool.coverage.paths]
hooring = ["src/hooring", "*/hooring/src/hooring"]
tests = ["tests", "*/hooring/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
